server.port = 8881

externalPropFile.path=/app/properties/appzillonbankingCOB-baseapp.properties

cobFlags=/app/properties/COB_FLAGS.properties
dbProperties.path=/app/properties/database.properties
ReportJsonFilePath=/app/resources/report/DATAFILES

connectionparams.maxTotalConnections=4096
connectionparams.maxRouteConnections=4096
connectionparams.maxLocalHostConnections=2048
connectionparams.defaultKeepAliveTime=20000
connectionparams.connectionTimeout=90000
connectionparams.requestTimeout=90000
connectionparams.socketTimeout=90000
connectionparams.idleConnectionWaitTime=30000
connectionparams.taskSchedulerPoolSize=5
connectionparams.hostIp=http://localhost
connectionparams.hostPortNumber=8485
litFileFormat=csv
spring.jpa.hibernate.naming.physical-strategy = org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl 
spring.main.allow-bean-definition-overriding=true

management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.endpoints.web.exposure.include=*


# Root should NEVER be DEBUG in deployed env
logging.level.root=INFO

# application logs
logging.level.com.iexceed.appzillonbanking=DEBUG

# Spring logs
logging.level.org.springframework=INFO
logging.level.org.springframework.web=INFO

# Hibernate
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF

# Hikari
logging.level.com.zaxxer.hikari=ERROR

logging.pattern.console=%d{dd-MM-yyyy HH:mm:ss.SSS} %magenta([%thread]) %highlight(%-5level) %logger.%M - %msg%n
logging.level.sun.rmi=ERROR
scheduler.pushbackfetch.crontime=0 */5 * * * ?
scheduler.dmsPush.crontime= 0 0/10 * * * ?

#Netty access logs
reactor.netty.http.server.accessLogEnabled=true
logging.level.reactor.netty.http.server.AccessLog=INFO
